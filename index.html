<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجتمع روبیکا - ورود / ثبت نام</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #000000;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            background-image: radial-gradient(circle at bottom left, rgba(0, 122, 255, 0.35) 0%, rgba(0, 122, 255, 0.1) 40%, rgba(255, 255, 255, 0) 70%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 122, 255, 0.1);
            text-align: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Glassmorphism Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid #007aff;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s ease;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.93);
        }

        .btn-back {
            border-color: #004085;
            background: rgba(0, 64, 133, 0.15);
            font-weight: 700;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #007aff;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        /* Masking password to prevent browser auto-fill/security banners */
        .secure-pass {
            -webkit-text-security: disk;
            -moz-text-security: disk;
        }

        /* Custom Modal / Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 85%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #007aff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Utility animations */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1;
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="container" id="mainContainer">
        <h1>به خرید و فروش مجتمع روبیکا خوش آمدید</h1>

        <!-- Step 1: Menu Buttons -->
        <div id="menuButtons">
            <button class="btn" onclick="showForm('registerForm')">ثبت نام (جدید)</button>
            <button class="btn" onclick="showForm('loginForm')">ورود (با رمز عبور و نام کاربری)</button>
            <button class="btn" onclick="showForm('adminLoginForm')">ورود مدیران</button>
        </div>

        <!-- Step 2: Register Form -->
        <div id="registerForm" class="hidden">
            <div class="form-group">
                <label>نام کاربری (انگلیسی و عدد، بیشتر از ۶ کاراکتر):</label>
                <input type="text" id="regUsername" class="input-field" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-group">
                <label>رمز عبور (بیشتر از ۶ کاراکتر):</label>
                <input type="text" id="regPassword" class="input-field secure-pass" autocomplete="off">
            </div>
            <button class="btn" onclick="handleRegister()">ثبت نام</button>
            <button class="btn btn-back" onclick="showMenu()">بازگشت</button>
        </div>

        <!-- Step 3: User Login Form -->
        <div id="loginForm" class="hidden">
            <div class="form-group">
                <label>نام کاربری:</label>
                <input type="text" id="loginUsername" class="input-field" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="text" id="loginPassword" class="input-field secure-pass" autocomplete="off">
            </div>
            <button class="btn" onclick="handleUserLogin()">ورود</button>
            <button class="btn btn-back" onclick="showMenu()">بازگشت</button>
        </div>

        <!-- Step 4: Admin Login Form -->
        <div id="adminLoginForm" class="hidden">
            <div class="form-group">
                <label>نام کاربری مدیر:</label>
                <input type="text" id="adminUsername" class="input-field" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-group">
                <label>رمز عبور مدیر:</label>
                <input type="text" id="adminPassword" class="input-field secure-pass" autocomplete="off">
            </div>
            <button class="btn" onclick="handleAdminLogin()">ورود به پنل مدیریت</button>
            <button class="btn btn-back" onclick="showMenu()">بازگشت</button>
        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <p id="modalText"></p>
            <button class="btn" onclick="closeModal()">تایید</button>
        </div>
    </div>

    <script>
        // UI Helpers
        window.showAlert = function(msg) {
            document.getElementById('modalText').innerText = msg;
            document.getElementById('customModal').classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('customModal').classList.remove('active');
        };

        window.showForm = function(formId) {
            const container = document.getElementById('mainContainer');
            container.classList.add('fade-out');
            
            setTimeout(() => {
                document.getElementById('menuButtons').classList.add('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminLoginForm').classList.add('hidden');

                document.getElementById(formId).classList.remove('hidden');
                container.classList.remove('fade-out');
            }, 300);
        };

        window.showMenu = function() {
            const container = document.getElementById('mainContainer');
            container.classList.add('fade-out');
            
            setTimeout(() => {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminLoginForm').classList.add('hidden');
                document.getElementById('menuButtons').classList.remove('hidden');

                container.classList.remove('fade-out');
            }, 300);
        };

        // Register Logic (ارسال به سرور ورسل)
        window.handleRegister = async function() {
            const usernameInput = document.getElementById('regUsername').value.trim();
            const passwordInput = document.getElementById('regPassword').value.trim();

            const validUsernameRegex = /^[a-zA-Z0-9]+$/;
            if (usernameInput.length <= 6 || !validUsernameRegex.test(usernameInput)) {
                showAlert('نام کاربری باید بیشتر از ۶ کاراکتر و فقط شامل حروف انگلیسی و عدد باشد.');
                return;
            }

            if (passwordInput.length <= 6) {
                showAlert('رمز عبور باید بیشتر از ۶ کاراکتر باشد.');
                return;
            }

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || 'خطا در ثبت نام.');
                    return;
                }

                sessionStorage.setItem('justRegistered', 'true');
                sessionStorage.setItem('currentUser', usernameInput);
                sessionStorage.setItem('currentPass', passwordInput);

                document.body.style.transition = "opacity 0.4s ease";
                document.body.style.opacity = "0";
                setTimeout(() => {
                    window.location.href = 'asli.html';
                }, 400);

            } catch (error) {
                showAlert('خطا در برقراری ارتباط با سرور.');
                console.error(error);
            }
        };

        // User Login Logic (بررسی از سرور ورسل)
        window.handleUserLogin = async function() {
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();

            if (!usernameInput || !passwordInput) {
                showAlert('لطفاً نام کاربری و رمز عبور را وارد کنید.');
                return;
            }

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (!response.ok) {
                    showAlert(result.message || 'خطا در بررسی اطلاعات.');
                    return;
                }

                sessionStorage.setItem('justLoggedIn', 'true');
                sessionStorage.setItem('currentUser', result.username);

                document.body.style.transition = "opacity 0.4s ease";
                document.body.style.opacity = "0";
                setTimeout(() => {
                    window.location.href = 'asli.html';
                }, 400);

            } catch (error) {
                showAlert('خطا در بررسی اطلاعات.');
                console.error(error);
            }
        };

        // Admin Login Logic (بررسی مدیریت از سرور ورسل)
        window.handleAdminLogin = async function() {
            const usernameInput = document.getElementById('adminUsername').value.trim();
            const passwordInput = document.getElementById('adminPassword').value.trim();

            if (!usernameInput || !passwordInput) {
                showAlert('لطفاً اطلاعات مدیریت را وارد کنید.');
                return;
            }

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'adminLogin', username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    document.body.style.transition = "opacity 0.4s ease";
                    document.body.style.opacity = "0";
                    setTimeout(() => {
                        window.location.href = 'aslimodir.html';
                    }, 400);
                } else {
                    showAlert(result.message || 'نام کاربری یا رمز عبور مدیریت اشتباه است.');
                }
            } catch (e) {
                showAlert('خطا در ورود به پنل مدیریت.');
                console.error(e);
            }
        };
    </script>
</body>
  </html>
